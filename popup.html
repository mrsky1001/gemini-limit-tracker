<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Gemini Pro — лимиты</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="title-block">
        <div class="title">Gemini Pro / Antigravity</div>
        <div class="subtitle" id="statsLine">Загрузка…</div>
      </div>
      <button class="icon-btn" id="settingsBtn" title="Настройки">⚙</button>
    </header>

    <div id="settingsPanel" class="settings-panel hidden">
      <div class="settings-row">
        <label for="defaultPeriod">Период по умолчанию (часов), если точной даты нет</label>
        <input type="number" id="defaultPeriod" min="0" step="0.5" />
      </div>
      <div class="settings-row">
        <label for="notifToggle">Уведомления о сбросе</label>
        <input type="checkbox" id="notifToggle" />
      </div>
      <div class="settings-row">
        <label for="sortToggle">Сначала ограниченные (по времени сброса)</label>
        <input type="checkbox" id="sortToggle" />
      </div>
      <div class="settings-actions">
        <button class="btn-secondary" id="statsBtn">📊 Статистика</button>
        <button class="btn-secondary" id="exportBtn">⬇ Экспорт JSON</button>
        <button class="btn-secondary" id="importBtn">⬆ Импорт JSON</button>
        <input type="file" id="importFileInput" accept="application/json" class="hidden" />
      </div>
      <div class="sync-note">Аккаунты и настройки синхронизируются между компьютерами через ваш Google-аккаунт Chrome.</div>
      <button class="link-btn" id="closeSettings">Закрыть</button>
    </div>

    <div id="syncWarning" class="sync-warning hidden">
      ⚠ Список слишком большой для синхронизации Chrome — данные сохранены только на этом устройстве.
    </div>

    <div id="accountsList" class="accounts-list"></div>

    <button class="add-btn" id="addAccountBtn">+ Добавить аккаунт</button>
  </div>

  <!-- Modal: добавить / редактировать аккаунт -->
  <div id="accountModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-title" id="accountModalTitle">Новый аккаунт</div>
      <label class="modal-label">Название</label>
      <input type="text" id="accountNameInput" placeholder="Например: Nikita Kolyada" />
      <label class="modal-label">Email аккаунта (необязательно, для кнопки «открыть»)</label>
      <input type="text" id="accountEmailInput" placeholder="name@gmail.com" />
      <label class="modal-label">Цвет метки</label>
      <div class="color-swatches" id="colorSwatches"></div>
      <div class="modal-actions">
        <button class="btn-secondary" id="accountModalCancel">Отмена</button>
        <button class="btn-primary" id="accountModalSave">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Modal: ввод периода при отметке лимита -->
  <div id="periodModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-title">Когда сбросится лимит?</div>
      <div class="account-preview" id="periodAccountName"></div>

      <label class="modal-label">Вставьте сообщение от Gemini целиком (необязательно)</label>
      <textarea id="pasteMessageInput" rows="3" placeholder="Your plan's baseline quota will refresh on 9/4/2026, 3:01:35 PM. ..."></textarea>
      <button class="btn-secondary parse-btn" id="parseMessageBtn">Распознать дату из текста</button>

      <label class="modal-label">Точная дата и время сброса</label>
      <input type="datetime-local" id="resetAtInput" />

      <label class="modal-checkbox-row">
        <input type="checkbox" id="rememberPeriodCheckbox" />
        <span>Запомнить интервал (часы от текущего момента) для этого аккаунта — в следующий раз применится автоматически без вопроса</span>
      </label>
      <div class="modal-actions">
        <button class="btn-secondary" id="periodModalCancel">Отмена</button>
        <button class="btn-primary" id="periodModalSave">Запустить таймер</button>
      </div>
    </div>
  </div>

  <!-- Modal: меню аккаунта -->
  <div id="menuModal" class="modal-overlay hidden">
    <div class="modal menu-modal">
      <button class="menu-item" id="menuEdit">✏ Переименовать / цвет</button>
      <button class="menu-item" id="menuEditPeriod">⏱ Отвязать автоинтервал</button>
      <button class="menu-item" id="menuResetNow">↺ Сбросить лимит сейчас</button>
      <button class="menu-item danger" id="menuDelete">🗑 Удалить аккаунт</button>
      <button class="link-btn" id="menuClose">Закрыть</button>
    </div>
  </div>

  <script src="shared/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
